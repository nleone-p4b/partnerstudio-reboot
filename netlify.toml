[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Rotte dell'app (blog): tutto torna su index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
